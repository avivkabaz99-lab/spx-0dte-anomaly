[project]
name = "spx0dte"
version = "0.1.0"
description = "Anomaly detection and research on SPX 0DTE options"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "python-dotenv>=1.0",
    "supabase>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = ["ib_insync>=0.9.86"]
model = ["lightgbm>=4.5", "scikit-learn>=1.5"]
dev = [
    "pytest>=8.3",
    "psycopg[binary]>=3.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spx0dte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
